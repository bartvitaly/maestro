buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: "com.android.application"

android {
    namespace "com.example.listings"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.listings"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
