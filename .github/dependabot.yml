# Dependabot version updates (supply-chain plan, Phase C). npm weekly with minor and patch
# grouped into one PR, GitHub Actions monthly in one PR. cooldown matches .npmrc
# min-release-age=7: no update is proposed for a release younger than 7 days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups: { minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups: { github-actions: { patterns: ['*'] } }
